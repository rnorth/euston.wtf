name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .tool-versions is the single source of truth for the Node version - mise reads it
      # locally, so CI should not carry a second copy of the number to drift from.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

# Cloudflare Pages builds every pull request already, so there is no `npm run build` step
# here - it would only prove the same thing twice.
